name: SuperMerge Build

on:
  push:
    branches: [ main ]
  schedule:
    # every 3 hours at :23 (avoid top-of-hour congestion)
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let two builds push at the same time (that is how bot-vs-bot
# conflicts on SuperMerge.yaml would happen).
concurrency:
  group: supermerge-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPER_OUT_DIR: ${{ github.workspace }}
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run merge
        run: python super_merge.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SuperMerge.yaml
          if git diff --cached --quiet; then
            echo "no changes, skip commit"
          else
            git commit -m "chore: auto-update $(TZ=Asia/Shanghai date +%Y-%m-%d_%H:%M)"
            git push
          fi
      - name: Purge jsDelivr cache
        run: |
          # jsDelivr caches branch refs for hours; purge so phones get the fresh file.
          curl -sf "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/SuperMerge.yaml" \
            && echo "jsDelivr cache purged" || echo "purge request failed (non-fatal)"
      - name: Publish GitHub Pages mirror
        run: |
          # Why a second endpoint: jsDelivr caches a rewritten branch for up to
          # 12h per edge node and its purge API is rate-limited (HTTP 429-ish
          # {"throttled":true}), so a phone can receive a stale file -- which is
          # how a bad node shipped once already. GitHub Pages is first-party,
          # reachable from CN, and its CDN TTL is ~10 min.
          #   https://<owner>.github.io/<repo>/SuperMerge.yaml
          mkdir -p "$RUNNER_TEMP/ghp" && cp SuperMerge.yaml "$RUNNER_TEMP/ghp/"
          cd "$RUNNER_TEMP/ghp"
          git init -q -b gh-pages
          git add SuperMerge.yaml
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "pages: build ${{ github.run_number }}"
          git push -f -q \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "published to https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY##*/}/SuperMerge.yaml"
